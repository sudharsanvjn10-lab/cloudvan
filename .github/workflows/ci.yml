name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-verification:
    name: Backend Security & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Verify Server Syntax & Startup Checks
        run: |
          node --check server/server.js
          node --check server/setup-db.js
          node --check server/bootstrap-admin.js

  frontend-verification:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Headless Unit Tests
        working-directory: ./client
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Verify Production Angular Build
        working-directory: ./client
        run: npm run build
