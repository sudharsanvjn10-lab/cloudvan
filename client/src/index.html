<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cloud Vantage Solutions | Oracle Fusion HCM Specialists</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cloud Vantage Solutions — Enterprise consulting, implementation, and support exclusively dedicated to Oracle Fusion Cloud HCM, Global Payroll, Talent, and Redwood UI extensions.">
  <meta name="keywords" content="Oracle Fusion HCM, Oracle HCM Cloud, Core HR, Global Payroll, Fast Formulas, Oracle Recruiting Cloud, ORC, Redwood UI, Visual Builder Studio, HDL">
  <meta name="theme-color" content="#0b0f19">

  <!-- OpenGraph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cloudvan-ui.onrender.com/">
  <meta property="og:title" content="Cloud Vantage Solutions | Oracle Fusion HCM Specialists">
  <meta property="og:description" content="Premier consulting partner exclusively dedicated to Oracle Fusion HCM implementations, Global Payroll, Talent, and Redwood UI extensions.">
  <meta property="og:image" content="https://cloudvan-ui.onrender.com/assets/logo.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cloud Vantage Solutions | Oracle Fusion HCM Specialists">
  <meta name="twitter:description" content="Premier consulting partner exclusively dedicated to Oracle Fusion HCM implementations, Global Payroll, Talent, and Redwood UI extensions.">

  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Minimal Preloader Styles (Vanilla CSS) -->
  <style>
    .initial-preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b0f19 0%, #161e2f 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      margin: 0;
    }
    .preloader-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .preloader-brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .preloader-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .preloader-title span {
      color: #3b82f6;
    }
    .preloader-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      border-right-color: #06b6d4;
      animation: cvs-spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .preloader-text {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    @keyframes cvs-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="initial-preloader">
      <div class="preloader-brand">
        <img src="assets/logo.png" alt="Cloud Vantage Solutions">
        <div class="preloader-title">Cloud Vantage <span>Solutions</span></div>
      </div>
      <div class="preloader-spinner"></div>
      <p class="preloader-text">Loading Oracle Fusion HCM Portal...</p>
    </div>
  </app-root>
</body>
</html>
