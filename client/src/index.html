  <!-- Minimal Preloader Styles (Vanilla CSS) -->
  <style>
    .initial-preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b0f19 0%, #161e2f 100%);
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      margin: 0;
    }
    .preloader-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .preloader-logo {
      height: 72px;
      width: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px -8px rgba(37, 99, 235, 0.6);
    }
    .preloader-tile {
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.55);
    }
    .preloader-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .preloader-title span {
      color: #3b82f6;
    }
    .preloader-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      border-right-color: #06b6d4;
      animation: cvs-spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .preloader-text {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    @keyframes cvs-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="initial-preloader">
      <div class="preloader-brand">
        <img class="preloader-logo" src="assets/logo-official.png" alt="Cloud Vantage logo">
        
      </div>
      <div class="preloader-spinner"></div>
      <p class="preloader-text">Loading Oracle Fusion HCM Portal...</p>
    </div>
  </app-root>
</body>
