services:
  # Static Site for Angular Frontend
  - type: web
    name: cloudvan-ui
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist/client/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20

  # Node.js Express API Backend
  - type: web
    name: cloudvan
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
